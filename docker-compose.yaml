services:
  webapp:
    build:
      context: ./src/webapp
      dockerfile: Dockerfile
    container_name: webapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Use host.docker.internal to connect to agent running on host machine
      # For Docker-only setup, change to: http://wowbits-adkweb:8000
      - AGENT_API_URL=http://host.docker.internal:8000
      - AGENT_APP_NAME=thanos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - threat-modeling-network

  threat-modeling-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-modeling-service
    ports:
      - "5151:5151"
    stdin_open: true
    tty: true
    volumes:
      - ./src:/app
    command: ["sleep", "infinity"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=threat_modeling
      - ADK_SESSION_SERVICE_URI=postgresql+asyncpg://postgres:postgres@postgres:5432/threat_modeling
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_MCP_HOST=neo4j-mcp
      - NEO4J_MCP_PORT=8000
    depends_on:
      - postgres
      - neo4j
      - neo4j-mcp
    networks:
      - threat-modeling-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=threat_modeling
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - threat-modeling-network

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - threat-modeling-network
    healthcheck:
      test:
        ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-mcp:
    image: docker.io/mcp/neo4j-cypher:latest
    container_name: neo4j-mcp
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=*
      - NEO4J_TRANSPORT=http
    ports:
      - "8000:8000" # MCP Server endpoint
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - threat-modeling-network

networks:
  threat-modeling-network:
    driver: bridge
